name: Android APK

# Builds the Android app (android-app/) and attaches the signed APK to a GitHub release.
# Run it from the Actions tab, or push a tag such as android-v1.0.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('android-build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see android-app/README.md)"; exit 1; }
          done
          npm ci --no-audit --no-fund
          npx cap add android
          # Native bits: 120 Hz, bar colours, animated splash, FCM notifications with buttons, mailto/share, haptics.
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          src=android/app/src/main
          cp native/*.java "$src/java/dev/amit/mail/"
          cp -r native/res/. "$src/res/"
          python3 patch_manifest.py "$src/AndroidManifest.xml"
          # Launch background in the app colour instead of white.
          printf '<?xml version="1.0" encoding="utf-8"?><resources><color name="mail_bg">#FF141316</color></resources>' > "$src/res/values/mail_colors.xml"
          sed -i 's#@drawable/splash#@color/mail_bg#' "$src/res/values/styles.xml"
          # Package Google Play's sign-in library with the Firebase auth plugin (without it the app crashes at launch).
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          grep -q rgcfaIncludeGoogle android/variables.gradle
          # GOOGLE_SERVICES_JSON may be the raw JSON or its base64.
          if [ "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | head -c1)" = "{" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json \
              || { echo "::error::GOOGLE_SERVICES_JSON is neither JSON nor valid base64"; exit 1; }
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64 (paste the whole contents of KEYSTORE_BASE64.txt)"; exit 1; }

          # App icon: reuse the web app's icon instead of the Capacitor default.
          res=android/app/src/main/res
          rm -rf "$res"/mipmap-anydpi-v26
          for d in "$res"/mipmap-*dpi; do
            cp ../public/icons/icon-192.png "$d/ic_launcher.png"
            cp ../public/icons/icon-192.png "$d/ic_launcher_round.png"
          done

          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # MailMessagingService extends FirebaseMessagingService, but the push plugin keeps firebase-messaging private; add it to the app too (same version as the plugin).
          printf '\ndependencies {\n    implementation "com.google.firebase:firebase-messaging:23.3.1"\n}\n' >> android/app/build.gradle
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=mail \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../mailbox.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Android app ${{ env.TAG }}
          files: android-app/mailbox.apk
