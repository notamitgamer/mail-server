name: Android APK

# Builds the Android app (android-app/) and attaches the signed APK to a GitHub release.
# Run it from the Actions tab, or push a tag such as android-v1.0.
on:
  workflow_dispatch:
  push:
    tags: ['android-v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('android-build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android-app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Repository secret $v is not set (see android-app/README.md)"; exit 1; }
          done
          npm ci --no-audit --no-fund
          npx cap add android
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          # App icon: reuse the web app's icon instead of the Capacitor default.
          res=android/app/src/main/res
          rm -rf "$res"/mipmap-anydpi-v26
          for d in "$res"/mipmap-*dpi; do
            cp ../public/icons/icon-192.png "$d/ic_launcher.png"
            cp ../public/icons/icon-192.png "$d/ic_launcher_round.png"
          done

          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          npx cap sync android
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=mail \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../mailbox.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Android app ${{ env.TAG }}
          files: android-app/mailbox.apk
